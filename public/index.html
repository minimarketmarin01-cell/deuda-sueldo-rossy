<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan de pago a Rossy</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0E6E58">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan pago Rossy">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F5F6F4; --surface:#FFFFFF; --surface-2:#EDEFEA; --border:#DCE1DB;
  --text:#14201B; --text-muted:#5C6B63;
  --accent:#0E6E58; --accent-strong:#0B5245; --accent-soft:#E3F1EC;
  --debt:#9C2B2B; --debt-soft:#FBEAEA;
  --amber:#8A6110; --amber-soft:#FBF1DE;
  --off:#8A8F8B; --off-soft:#EEEFED;
  --shadow: 0 1px 2px rgba(20,32,27,.06), 0 6px 16px rgba(20,32,27,.06);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1512; --surface:#16201B; --surface-2:#1C2620; --border:#2A362E;
    --text:#E9EFEA; --text-muted:#93A69B;
    --accent:#3FBE98; --accent-strong:#59D2AC; --accent-soft:#16332A;
    --debt:#E58585; --debt-soft:#3A1D1D;
    --amber:#D9AE56; --amber-soft:#332711;
    --off:#7C8A83; --off-soft:#1B241E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Public Sans',system-ui,sans-serif;margin:0;padding:24px 16px 56px;}
.wrap{max-width:920px;margin:0 auto;}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;text-wrap:balance;margin:0;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
.eyebrow{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-strong);font-weight:600;margin-bottom:8px;}
h1{font-size:clamp(24px,5vw,32px);font-weight:700;}
.subtitle{color:var(--text-muted);font-size:15px;margin-top:8px;max-width:60ch;line-height:1.5;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0 32px;}
@media (max-width:640px){.stat-grid{grid-template-columns:1fr;}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);}
.stat-card.debt{background:var(--debt-soft);border-color:var(--debt);}
.stat-label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:600;}
.stat-value{font-size:clamp(20px,4.2vw,26px);font-weight:600;margin-top:6px;}
.stat-card.debt .stat-value{color:var(--debt);font-size:clamp(24px,5vw,32px);}
.stat-sub{font-size:12.5px;color:var(--text-muted);margin-top:4px;}
section{margin-bottom:32px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
h2{font-size:19px;font-weight:600;}
.section-note{font-size:13px;color:var(--text-muted);line-height:1.5;margin-bottom:14px;max-width:70ch;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px 18px 6px;}
.params-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:12px;color:var(--text-muted);font-weight:600;}
input,select{font-family:'IBM Plex Mono',monospace;font-size:14px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);}
input[type="text"],select{font-family:'Public Sans',sans-serif;}
input[type="number"]{text-align:right;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);padding:8px 10px;border-bottom:1px solid var(--border);}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;margin-bottom:14px;}
.tramo-input{width:110px;}
.del-btn{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;}
.del-btn:hover{border-color:var(--debt);color:var(--debt);}
.cat-grid{display:flex;flex-direction:column;gap:10px;}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;}
.cat-card.off{opacity:.55;}
.cat-top{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap;}
.cat-check{width:18px;height:18px;accent-color:var(--accent);flex:none;}
.cat-name{font-weight:600;font-size:14.5px;flex:1 1 180px;min-width:160px;}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:999px;flex:none;}
.badge.confirmado{background:var(--accent-soft);color:var(--accent-strong);}
.badge.inferido{background:var(--amber-soft);color:var(--amber);}
.badge.excluido{background:var(--off-soft);color:var(--off);}
.cat-subtotal{font-family:'IBM Plex Mono',monospace;font-weight:600;flex:none;}
.cat-body{padding:0 16px 14px;}
.cat-desc{font-size:12.5px;color:var(--text-muted);margin:0 0 8px;line-height:1.5;}
details{margin-top:4px;}
summary{cursor:pointer;font-size:12.5px;color:var(--accent-strong);font-weight:600;padding:4px 0;}
.formula{background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:12px 14px;font-size:13px;margin-top:10px;}
.formula b{color:var(--accent-strong);}
.disclaimer{background:var(--amber-soft);border:1px solid var(--amber);border-radius:10px;padding:12px 14px;font-size:12.5px;margin-top:14px;line-height:1.55;}
footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--border);}
footer p,footer ul{font-size:12.5px;color:var(--text-muted);line-height:1.7;}
footer a{color:var(--accent-strong);}
.add-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
.add-form .field{min-width:130px;}
.add-form .field.grow{flex:1 1 180px;}
button.primary{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-family:'Public Sans',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;}
button.primary:hover{background:var(--accent-strong);}
.status-msg{font-size:12.5px;margin-top:8px;min-height:16px;}
.status-msg.ok{color:var(--accent-strong);}
.status-msg.err{color:var(--debt);}
.loading{padding:40px 0;text-align:center;color:var(--text-muted);font-size:14px;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Cargando datos de D1…</div>
</div>

<script>
const fmt = n => '$' + Math.round(n).toLocaleString('es-CL');
const fmtDate = iso => {
  const [y,m,d] = iso.split('-');
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${d} ${meses[parseInt(m,10)-1]} ${y}`;
};
const badgeLabel = {confirmado:'Confirmado', inferido:'Inferido — revisa', excluido:'Excluido por defecto'};

let STATE = null;

async function api(path, opts){
  const res = await fetch(path, {
    headers: {'content-type':'application/json'},
    ...opts,
  });
  if(!res.ok){
    const body = await res.json().catch(()=>({error:res.statusText}));
    throw new Error(body.error || 'Error de red');
  }
  return res.json();
}

async function loadState(){
  STATE = await api('/api/state');
}

function monthStart(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }

function rateForMonth(tramos, ms){
  for(const t of tramos){
    if(ms >= new Date(t.from_date) && ms <= new Date(t.to_date)) return t.monto;
  }
  if(tramos.length && ms < new Date(tramos[0].from_date)) return tramos[0].monto;
  return tramos.length ? tramos[tramos.length-1].monto : 0;
}

function computeDevengado(){
  const startVal = document.getElementById('fecha-inicio').value;
  const cutoffVal = document.getElementById('fecha-corte').value;
  if(!startVal || !cutoffVal) return {total:0, months:0};
  const start = new Date(startVal+'T00:00:00');
  const cutoff = new Date(cutoffVal+'T00:00:00');
  let cursor = monthStart(start);
  const cutoffMonth = monthStart(cutoff);
  let total = 0, months = 0;
  while(cursor <= cutoffMonth){
    const rate = rateForMonth(STATE.tramos, cursor);
    if(cursor.getTime() === cutoffMonth.getTime()){
      const dim = daysInMonth(cursor);
      total += rate * (Math.min(cutoff.getDate(), dim) / dim);
    } else {
      total += rate;
    }
    months += 1;
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
  }
  return {total, months};
}

function computeAbonado(){
  let total = 0, n = 0;
  STATE.categories.forEach(cat=>{
    if(cat.checked){ total += cat.subtotal; n++; }
  });
  return {total, n};
}

function recalcStats(){
  const {total: devengado, months} = computeDevengado();
  const {total: abonado, n} = computeAbonado();
  const deuda = devengado - abonado;
  document.getElementById('out-devengado').textContent = fmt(devengado);
  document.getElementById('out-devengado-sub').textContent = months + ' meses de sueldo minimo legal';
  document.getElementById('out-abonado').textContent = fmt(abonado);
  document.getElementById('out-abonado-sub').textContent = n + ' de ' + STATE.categories.length + ' grupos marcados';
  const deudaEl = document.getElementById('out-deuda');
  const deudaSub = document.getElementById('out-deuda-sub');
  if(deuda < 0){
    deudaEl.textContent = '$0';
    deudaSub.textContent = 'Sin deuda — se pago ' + fmt(Math.abs(deuda)) + ' de mas';
  } else {
    deudaEl.textContent = fmt(deuda);
    deudaSub.textContent = 'Devengado − abonado';
  }
}

function setStatus(el, msg, ok){
  el.textContent = msg;
  el.className = 'status-msg ' + (ok ? 'ok' : 'err');
  if(ok) setTimeout(()=>{ if(el.textContent===msg) el.textContent=''; }, 2500);
}

function render(){
  const app = document.getElementById('app');
  const today = new Date().toISOString().slice(0,10);
  const fechaInicio = STATE.settings.fecha_inicio || '2023-05-01';

  app.innerHTML = `
    <header>
      <div class="eyebrow">Minimarket Marin 376 · Control de sueldos</div>
      <h1>Plan de pago a Rossy</h1>
      <p class="subtitle">Guardado en Cloudflare D1. Agrega abonos nuevos, ajusta tramos y la deuda se recalcula sola.</p>
      <p class="subtitle"><a href="/resumen" style="color:var(--accent-strong);font-weight:600;">Ver resumen simple con gráficos →</a></p>
    </header>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Total devengado</div>
        <div class="stat-value mono" id="out-devengado">$0</div>
        <div class="stat-sub" id="out-devengado-sub">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total abonado</div>
        <div class="stat-value mono" id="out-abonado">$0</div>
        <div class="stat-sub" id="out-abonado-sub">—</div>
      </div>
      <div class="stat-card debt">
        <div class="stat-label">Deuda actual</div>
        <div class="stat-value mono" id="out-deuda">$0</div>
        <div class="stat-sub" id="out-deuda-sub">Devengado − abonado</div>
      </div>
    </div>

    <section id="params">
      <div class="section-head"><h2>1. Periodo y sueldo base</h2></div>
      <p class="section-note">Sueldo base = ingreso minimo mensual legal vigente en cada tramo. Edita los montos si el sueldo pactado era otro; se guarda al instante.</p>
      <div class="panel">
        <div class="params-row">
          <div class="field">
            <label for="fecha-inicio">Deuda desde</label>
            <input type="date" id="fecha-inicio" value="${fechaInicio}">
          </div>
          <div class="field">
            <label for="fecha-corte">Calcular hasta</label>
            <input type="date" id="fecha-corte" value="${today}">
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Periodo</th><th>Fuente legal</th><th class="num">Sueldo mensual</th></tr></thead>
            <tbody id="tramos-body">
              ${STATE.tramos.map(t=>`
                <tr>
                  <td>${t.label}</td>
                  <td>${t.fuente}</td>
                  <td class="num">$<input type="number" class="tramo-input" data-id="${t.id}" value="${t.monto}" step="1000"></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div class="status-msg" id="params-status"></div>
      </div>
    </section>

    <section id="categories">
      <div class="section-head"><h2>2. Abonos registrados</h2></div>
      <p class="section-note">Desmarca lo que no corresponda a sueldo de Rossy. Cada grupo suma sus movimientos reales guardados en D1.</p>

      <div class="panel">
        <h3 style="font-size:14px;margin-bottom:10px;">Agregar abono nuevo</h3>
        <form class="add-form" id="add-form">
          <div class="field">
            <label for="add-fecha">Fecha</label>
            <input type="date" id="add-fecha" required>
          </div>
          <div class="field grow">
            <label for="add-cat">Grupo</label>
            <select id="add-cat">
              ${STATE.categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
              <option value="__new__">+ Crear grupo nuevo…</option>
            </select>
          </div>
          <div class="field grow" id="new-cat-field" hidden>
            <label for="new-cat-name">Nombre del grupo nuevo</label>
            <input type="text" id="new-cat-name" placeholder="ej: App de gastos - octubre 2026">
          </div>
          <div class="field">
            <label for="add-monto">Monto</label>
            <input type="number" id="add-monto" min="1" step="1" required>
          </div>
          <div class="field grow">
            <label for="add-nota">Nota (opcional)</label>
            <input type="text" id="add-nota" placeholder="ej: transferencia Santander">
          </div>
          <button class="primary" type="submit">Agregar</button>
        </form>
        <div class="status-msg" id="add-status"></div>
      </div>

      <div class="cat-grid" id="cat-grid" style="margin-top:14px;"></div>
    </section>

    <section>
      <div class="formula"><b>Deuda</b> = Σ sueldo minimo legal por mes (prorateado el mes de corte) − Σ subtotales de abonos marcados ✓</div>
      <div class="disclaimer">
        Estimacion para negociar con la trabajadora, no un finiquito legal. No incluye gratificacion legal, cotizaciones previsionales ni intereses.
        Para un calculo laboral formal, revisa con la Direccion del Trabajo (<a href="https://www.dt.gob.cl" target="_blank" rel="noopener">dt.gob.cl</a>) o un abogado laboral.
      </div>
    </section>

    <footer>
      <p><strong>Fuentes del ingreso minimo legal:</strong></p>
      <ul>
        <li><a href="https://www.mintrab.gob.cl/reajuste-al-ingreso-minimo-mensual/" target="_blank" rel="noopener">Mintrab — Reajuste al ingreso minimo mensual</a></li>
        <li><a href="https://www.mintrab.gob.cl/ya-es-una-realidad-diario-oficial-publica-ley-21-751-que-reajusta-el-monto-del-ingreso-minimo-mensual/" target="_blank" rel="noopener">Mintrab — Ley 21.751, gradualidad 2024-2026</a></li>
        <li><a href="https://www.dt.gob.cl/portal/1628/w3-article-60141.html" target="_blank" rel="noopener">Direccion del Trabajo — Valor del ingreso minimo mensual</a></li>
        <li><a href="https://www.gob.cl/noticias/aumento-historico-sueldo-minimo-enero-2026/" target="_blank" rel="noopener">Gob.cl — Sueldo minimo enero 2026</a></li>
      </ul>
    </footer>
  `;

  renderCategories();
  recalcStats();
  wireEvents();
}

function renderCategories(){
  const grid = document.getElementById('cat-grid');
  grid.innerHTML = STATE.categories.map(cat=>{
    const items = STATE.payments.filter(p=>p.category_id===cat.id);
    const rows = items.map(it=>`
      <tr>
        <td>${fmtDate(it.fecha)}</td>
        <td class="num">${fmt(it.monto)}</td>
        <td>${it.nota||''}</td>
        <td><button class="del-btn" data-payment-id="${it.id}">eliminar</button></td>
      </tr>`).join('');
    return `
      <div class="cat-card ${cat.checked?'':'off'}" data-cat-id="${cat.id}">
        <div class="cat-top">
          <input type="checkbox" class="cat-check" data-cat-id="${cat.id}" ${cat.checked?'checked':''}>
          <div class="cat-name">${cat.name}</div>
          <span class="badge ${cat.status}">${badgeLabel[cat.status]}</span>
          <div class="cat-subtotal mono">${fmt(cat.subtotal)}</div>
        </div>
        <div class="cat-body">
          <p class="cat-desc">${cat.description}</p>
          <details>
            <summary>Ver ${items.length} movimiento${items.length===1?'':'s'}</summary>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Fecha</th><th class="num">Monto</th><th>Nota</th><th></th></tr></thead>
                <tbody>${rows || '<tr><td colspan="4" style="color:var(--text-muted)">Sin movimientos</td></tr>'}</tbody>
              </table>
            </div>
          </details>
        </div>
      </div>`;
  }).join('');
}

function wireEvents(){
  const paramsStatus = document.getElementById('params-status');

  document.getElementById('fecha-corte').addEventListener('input', recalcStats);

  document.getElementById('fecha-inicio').addEventListener('change', async (e)=>{
    try{
      await api('/api/settings', {method:'PUT', body: JSON.stringify({fecha_inicio: e.target.value})});
      STATE.settings.fecha_inicio = e.target.value;
      setStatus(paramsStatus, 'Guardado', true);
      recalcStats();
    }catch(err){ setStatus(paramsStatus, 'Error: '+err.message, false); }
  });

  document.querySelectorAll('.tramo-input').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      const id = e.target.dataset.id;
      const monto = Number(e.target.value);
      try{
        await api('/api/tramos/'+id, {method:'PUT', body: JSON.stringify({monto})});
        const t = STATE.tramos.find(t=>String(t.id)===id);
        if(t) t.monto = monto;
        setStatus(paramsStatus, 'Guardado', true);
        recalcStats();
      }catch(err){ setStatus(paramsStatus, 'Error: '+err.message, false); }
    });
  });

  document.querySelectorAll('.cat-check').forEach(chk=>{
    chk.addEventListener('change', async (e)=>{
      const id = e.target.dataset.catId;
      const checked = e.target.checked;
      try{
        await api('/api/categories/'+id, {method:'PUT', body: JSON.stringify({checked})});
        const c = STATE.categories.find(c=>c.id===id);
        if(c) c.checked = checked;
        document.querySelector(`.cat-card[data-cat-id="${id}"]`).classList.toggle('off', !checked);
        recalcStats();
      }catch(err){ e.target.checked = !checked; alert('Error: '+err.message); }
    });
  });

  document.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const id = e.target.dataset.paymentId;
      if(!confirm('¿Eliminar este movimiento?')) return;
      try{
        await api('/api/payments/'+id, {method:'DELETE'});
        await loadState();
        render();
      }catch(err){ alert('Error: '+err.message); }
    });
  });

  const addForm = document.getElementById('add-form');
  const addStatus = document.getElementById('add-status');
  const addCatSelect = document.getElementById('add-cat');
  const newCatField = document.getElementById('new-cat-field');
  const newCatName = document.getElementById('new-cat-name');

  addCatSelect.addEventListener('change', ()=>{
    const isNew = addCatSelect.value === '__new__';
    newCatField.hidden = !isNew;
    newCatName.required = isNew;
    if(isNew) newCatName.focus();
  });

  addForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fecha = document.getElementById('add-fecha').value;
    let category_id = addCatSelect.value;
    const monto = Number(document.getElementById('add-monto').value);
    const nota = document.getElementById('add-nota').value.trim();
    try{
      if(category_id === '__new__'){
        const name = newCatName.value.trim();
        if(!name){ setStatus(addStatus, 'Escribe el nombre del grupo nuevo', false); return; }
        const created = await api('/api/categories', {method:'POST', body: JSON.stringify({name})});
        category_id = created.id;
      }
      await api('/api/payments', {method:'POST', body: JSON.stringify({fecha, category_id, monto, nota})});
      setStatus(addStatus, 'Abono agregado', true);
      await loadState();
      render();
    }catch(err){
      setStatus(addStatus, 'Error: '+err.message, false);
    }
  });
}

(async function init(){
  try{
    await loadState();
    render();
  }catch(err){
    document.getElementById('app').innerHTML = `<div class="loading">Error cargando datos: ${err.message}</div>`;
  }
})();
</script>
</body>
</html>
